name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund --no-audit
      - run: npm run build
      - run: npm test
      - name: Smoke - discovery, a2a, pack
        run: |
          node dist/cli.js list
          node dist/cli.js a2a gen
          node dist/cli.js pack dsh-tool-text-summary
      - name: MCP bridge protocol smoke
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node dist/bridge/server.js > out.jsonl || true
          grep -q '"tools"' out.jsonl && echo "tools/list OK"
      - name: Determinism check
        run: |
          node dist/cli.js demo carbon >/dev/null 2>&1
          H1=$(sha256sum carbon-strategy-report.md | cut -d' ' -f1)
          node dist/cli.js demo carbon >/dev/null 2>&1
          H2=$(sha256sum carbon-strategy-report.md | cut -d' ' -f1)
          test "$H1" = "$H2" && echo "deterministic OK"
      - name: Refresh docs catalog
        run: node dist/cli.js registry gen docs
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "chore: refresh registry catalog [skip ci]" && git push)
